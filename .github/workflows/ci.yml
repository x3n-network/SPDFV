name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Run release-grade validation
        run: bash Scripts/validate_project.sh --release

      - name: Rehearse unsigned release
        env:
          RUN_TESTS: "0"
        run: bash Scripts/release_macos.sh 999.0.0 --dry-run
